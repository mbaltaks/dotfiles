- clean: ["~"]

- link:
    ~/.dotfiles: ""
    ~/.gitconfig: gitconfig
    ~/.gitconfig_local: gitconfig_local
    ~/.gitignore_global: gitignore_global
    ~/.bashrc: bashrc
    ~/.bash_profile: bash_profile
    ~/.zlogin: zlogin
    ~/.zlogout: zlogout
    ~/.zprofile: zprofile
    ~/.zshenv: zshenv
    ~/.zshrc: zshrc
    ~/.profile:
      path: profile
      if: "[ -f profile ]"
    ~/.vimrc: vimrc
    ~/.vim: vim/
    ~/.vim/autoload: vim-pathogen/autoload
    ~/.config/nvim: vim/
    ~/.config/nvim/init.vim: vimrc
    ~/.config/starship.toml:
      path: starship.toml
      if: "[ -f starship.toml ]"
    ~/.inputrc: inputrc
    ~/.editrc: editrc
    ~/.termcap: termcap
    ~/.atom: atom
    ~/.tmux.conf:
      path: tmux.conf
      if: "[ -f tmux.conf ]"
    ~/.screenrc:
      path: screenrc
      if: "[ -f screenrc ]"
    ~/.gdbinit: gdbinit
    ~/.lldbinit: lldbinit
    ~/.asdfrc: asdfrc
    ~/Library/Application Support/Code/User:
      path: vscode/User
      create: true
    ~/Library/Application Support/VSCodium/User:
      path: vscode/User
      create: true
    ~/Library/Application Support/BBEdit: bbedit/BBEdit
    ~/Library/Preferences/com.barebones.bbedit.plist: bbedit/com.barebones.bbedit.plist
    ~/.gemrc:
      path: gemrc
      if: "[ -f gemrc ]"

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [make -C src/fix_clipboard test, Building and testing fix_clipboard]
    - [ln -sfn fix_clipboard bin/fcb, Linking fcb to fix_clipboard]
